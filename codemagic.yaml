workflows:
  vorex-android:
    name: VOREX Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (debug — no signing needed to test on your phone)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
